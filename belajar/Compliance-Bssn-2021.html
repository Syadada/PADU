p) untuk end-to-end authenticity. BSSN hanya minta single hash.",status:"EXCEEDS",catatan:"BSSN cuma minta hash, kita dual hash untuk cegah tampering pre-encrypt & post-encrypt"},{bab:"BAB III Standar Teknis Data Pasal 19-24",pasal:"Pasal 22 – Keutuhan (Integrity)",persyaratan:"Deteksi modifikasi data, mekanisme anti-tampering, penggunaan TTE tersertifikasi jika ada Berita Acara.",desain:"Deteksi modifikasi via dual hash mismatch = STOP GATE otomatis, dituangkan di SOP V2 L14. BAST V2 ditandatangani TTE elektronik BSrE, bukan tanda tangan basah.",status:"COMPLY"},{bab:"BAB III Standar Teknis Data Pasal 19-24",pasal:"Pasal 23 – Kenirsangkalan (Non-Repudiation)",persyaratan:"TTE tersertifikasi PSrE, penjaminan keabsahan oleh Penyelenggara Sertifikat Elektronik.",desain:"BAST V2 TTE BSrE oleh Pihak Pertama, Pihak Kedua, dan Saksi DPO/CSIRT. Menggunakan PSrE Berinduk Kominfo. Log aktivitas melekat pada dokumen BAST.",status:"COMPLY",catatan:"Pastikan sertifikat BSrE aktif saat TTE, cek di https://tte.komdigi.go.id"},{bab:"BAB III Standar Teknis Data Pasal 19-24",pasal:"Pasal 24 – Ketersediaan (Availability)",persyaratan:"Pencadangan berkala, perencanaan akses, pemulihan data, retensi.",desain:"Backup log SIEM, laporan berbagipakai, BAST & hash log direplikasi ke Walidata. Retensi 5 tahun sesuai arsip DTSEN. Pemulihan via arsip sekunder Walidata.",status:"COMPLY"},{bab:"BAB III Sistem Penghubung Layanan Pasal 30-31",pasal:"Pasal 31 ayat (1) – Keamanan Sistem Penghubung",persyaratan:"TTE tersertifikasi, enkripsi data, akses sesuai otoritas, penggunaan hash function.",desain:"Enkripsi AES-256, hash SHA256 dual, akses sesuai RBAC yang tercantum di BAST V2 Pasal 2, TTE BSrE. Seluruhnya terpenuhi di paket BAST V2.",status:"COMPLY"},{bab:"BAB III Sistem Penghubung Layanan Pasal 30-31",pasal:"Pasal 31 ayat (2) – Kontrol Teknis Lengkap Penghubung Layanan",persyaratan:"SSL/TLS terkini, IPSec, anti-DDoS, autentikasi, manajemen sesi, pembatasan akses, validasi input, kriptografi, sertifikat elektronik, penanganan eror & log, proteksi jalur, antivirus, SLA 95%, bebas kerentanan.",desain:"Desain air-gapped laptop-to-laptop wireless isolated ad-hoc TANPA INTERNET: permukaan serangan publik = NOL, sehingga anti-DDoS tidak relevan (EXCEEDS). Autentikasi RBAC + password out-of-band lisan/amplop. Manajemen sesi hanya 2 party point-to-point. Pembatasan akses MAC filtering 2 MAC only. Validasi input via hash. Log SIEM lengkap. Antivirus update & patch OS.",status:"EXCEEDS",catatan:"Lebih aman karena tidak ada koneksi publik sama sekali – risiko DDoS, sniffing internet, MitM publik = 0"},{bab:"BAB III Jaringan Intra Pasal 32-33 (INTI DESAIN)",pasal:"Pasal 32 ayat (2) – Aspek Administratif Jaringan Intra",persyaratan:"Arsitektur jaringan, identifikasi aset, SOP pemeliharaan, laporan periodik keamanan.",desain:"Arsitektur: SE Sekda + SOP V2 16 langkah + BAST V2 sebagai SOP lengkap. Identifikasi aset: BMD Hostname, MAC Address, Serial Number, foto sticker BMD. Laporan periodik: BAST + log SIEM triwulan ke Sekda & Inspektorat.",status:"COMPLY"},{bab:"BAB III Jaringan Intra Pasal 32-33",pasal:"Pasal 33 ayat (2) – Kontrol Akses & Autentikasi Jaringan Intra",persyaratan:"Perangkat zona terpisah, autentikasi kuat, pembatasan akses, matikan protocol/port tidak digunakan, filtering, honeypot, VPN enkripsi, admin only install, secure endpoints, block layanan tidak dikenal, SSL/TLS, server perantara.",desain:"Zona terpisah = ruangan steril terkunci, bebas perangkat liar. Autentikasi RBAC + password out-of-band. Pembatasan hanya 2 MAC (filtering). Matikan Bluetooth/Hotspot/Airplane Mode kecuali WiFi isolated. VPN tidak perlu karena offline = EXCEEDS (tidak ada traffic yang bisa di-intercept). Secure endpoints laptop BMD antivirus patch. Block layanan tidak dikenal via scan WiFi sekitar.",status:"EXCEEDS"},{bab:"BAB III Jaringan Intra Pasal 32-33",pasal:"Pasal 33 ayat (3) – Perangkat & Aplikasi Keamanan Jaringan",persyaratan:"SIEM, deteksi kerentanan, firewall, IDS/IPS, VPN terenkripsi, patching, WAF, load balancer, update teknologi, enterprise software distribution, sertifikat elektronik.",desain:"SIEM: SOP V2 langkah 16 logging netstat/arp/hash. Firewall OS aktif di kedua laptop. IDS/IPS sederhana via netstat & arp -a untuk deteksi perangkat liar. Patching antivirus & OS terbaru. Tidak perlu WAF/load balancer karena point-to-point. TTE sertifikat elektronik BSrE.",status:"COMPLY",catatan:"Minor: dokumentasikan host firewall aktif di checklist ruangan steril"},{bab:"BAB III Jaringan Intra Pasal 32-33",pasal:"Pasal 33 ayat (4) – Gateway Jaringan Intra",persyaratan:"Content filtering, packet filtering, kontrol akses jarak jauh, gateway tidak terkoneksi langsung dengan jaringan publik, manajemen traffic, port tidak dibuka default.",desain:"Gateway tidak terkoneksi langsung dengan publik = EXCEEDS TOTAL. Kita tidak memiliki gateway ke internet sama sekali. Packet filtering via hanya 2 MAC yang diizinkan. Port tidak dibuka default, hanya ad-hoc 802.11.",status:"EXCEEDS"},{bab:"BAB III Jaringan Intra Pasal 32-33",pasal:"Pasal 33 ayat (5) – Kontrol Access Point Nirkabel",persyaratan:"Protokol keamanan terkini & enkripsi terkini, MAC filtering, dedicated SSID, pembatasan jangkauan radio & pengguna, pembatasan penambahan perangkat tidak sah, vulnerability management, patching firmware.",desain:"SSID dedicated ad-hoc DTSEN-ISOLATED-BANTEN. Enkripsi WPA2-AES (rekomendasi upgrade ke WPA3). MAC filtering hanya 2 MAC. Pembatasan jangkauan ruangan steril (dinding + jarak <10m). Pembatasan penambahan perangkat via scan WiFi manual. Vulnerability management ruangan steril checklist.",status:"COMPLY",catatan:"Rekomendasi: gunakan WPA3-SAE bila driver mendukung"},{bab:"BAB III Jaringan Intra Pasal 32-33",pasal:"Pasal 33 ayat (6) – Konfigurasi AP & Hardening",persyaratan:"Kata sandi kuat, AAA, akses konfigurasi jarak jauh hanya darurat, isolasi/segmentasi, nonaktifkan interface tidak digunakan.",desain:"Password 16 karakter acak kuat out-of-band (lisan + amplop sealed). Isolasi jaringan ad-hoc tanpa internet = segmentasi total. Nonaktifkan Bluetooth, Hotspot, NFC, File Sharing, interface tidak digunakan. AAA via RBAC Walidata.",status:"EXCEEDS"},{bab:"BAB III Pusat Data Pasal 34-35",pasal:"Pasal 35 – Keamanan Perangkat di Pusat Data / Intra",persyaratan:"Keamanan perangkat terkoneksi, putus akses tidak terotorisasi, admin tidak remote, hanya personil berwenang, backup berkala, bebas virus/malware, pembatasan removable media, izin USB, IP/hostname ditentukan, server perantara.",desain:"Hanya personil RBAC berwenang (2 orang) sesuai BAST. Perangkat BMD bebas virus/malware (scan pre-op). Pembatasan removable media = kita tidak pakai USB sama sekali untuk transfer, hanya wireless isolated = EXCEEDS. IP/hostname ad-hoc ditentukan manual di SOP. Backup log & BAST berkala. Tidak ada remote admin.",status:"EXCEEDS",catatan:"Lebih ketat: tanpa USB menghilangkan risiko BadUSB & malware USB"},{bab:"BAB III Tambahan - Evaluasi",pasal:"Pasal 15 & Pasal 27 – Evaluasi Kinerja & Manajemen Kunci",persyaratan:"Evaluasi kinerja keamanan SPBE periodik & manajemen kunci kriptografi (key management).",desain:"Evaluasi sudah ada via audit Inspektorat, namun belum ada klausul evaluasi tahunan SOP V2 oleh Sekda selaku koordinator. Manajemen kunci password 7zip masih lisan/amplop, belum ada register kunci formal di Walidata.",status:"NEED MINOR ADJUST"},{bab:"BAB III Tambahan - Log & SIEM",pasal:"Pasal 10 ayat (3) – Pencatatan Log & Monitoring",persyaratan:"Pencatatan log aktivitas, penyimpanan log terpusat, integritas log.",desain:"SOP V2 L16 sudah ada SIEM: log netstat, arp, hash, foto. Namun log belum ditandatangani hash harian & belum ada SOP retensi log 5 tahun eksplisit.",status:"NEED MINOR ADJUST"},{bab:"BAB III Tambahan - Firmware",pasal:"Pasal 33 ayat (5) huruf g – Patching & Vulnerability AP",persyaratan:"Patching firmware access point & manajemen kerentanan nirkabel.",desain:"Driver WiFi laptop sudah update, namun belum
