-117)",lane:"Lane_DPO",type:"task",doc:"DPO cek segel kit, Device Manager RTL8153, ipconfig no gateway, hash S0/S2/S3.",pasal:"PP33 Pasal 116-117 Dokumentasi, GDPR Art.30",command:"DPO_CHECK --pre-transfer --pasal 116"},{id:"Task_Share_SMB",name:"Share SMB (Laptop A)",lane:"Lane_Pengendali",type:"task",doc:"Share folder dengan READ only.",pasal:"Pasal 22 Least Privilege",command:"net share PDP15G=C:\\Transfer /GRANT:Everyone,READ"},{id:"Task_Robocopy",name:"Transfer S3 via Robocopy /Z (Laptop B)",lane:"Lane_Prosesor",type:"task",doc:"Robocopy restartable mode dengan log presisi.",pasal:"Pasal 116 Dokumentasi Transfer",command:"robocopy \\\\10.10.10.1\\PDP15G D:\\Incoming largefile_enc.7z /Z /J /V /TS /FP /BYTES /LOG:robocopy.log"},{id:"Task_Handover_Kertas_D",name:"Serahkan Kertas D (HASH S3 tertulis)",lane:"Lane_Pengendali",type:"task",doc:"Separate Channel 1: Hash tertulis one-time use, diserahkan fisik.",pasal:"NIST SP 800-57 Key Separation, Pasal 24",command:"HANDOVER --doc Kertas_D --channel fisik"},{id:"Task_Verify_S3",name:"Verifikasi Hash S3 vs Kertas D (Laptop B)",lane:"Lane_Prosesor",type:"task",doc:"Verifikasi integritas file diterima vs kertas D.",pasal:"Pasal 123 Verifikasi Integritas",command:"certutil -hashfile D:\\Incoming\\largefile_enc.7z SHA256"},{id:"Gateway_S3_Match",name:"Hash S3 MATCH?",lane:"Lane_Prosesor",type:"gateway",doc:"Apakah hash S3 cocok dengan Kertas D? Jika TIDAK -> Purge.",pasal:"Pasal 123, NIST SP 800-88 Fail Secure",command:"IF HASH_S3 == Kertas_D THEN YA ELSE TIDAK"},{id:"Task_Purge_Fail_S3",name:"FAIL: Secure Purge S3 (SDelete + cipher)",lane:"Lane_Prosesor",type:"fail",doc:"FAIL STATE: Secure purge dengan SDelete 7 pass + cipher /w.",pasal:"NIST SP 800-88 Purge, ISO 27001 A.8.10, Pasal 123",command:"sdelete64.exe -p 7 D:\\Incoming\\largefile_enc.7z ; cipher /w:D:\\Incoming"},{id:"Task_Robek_D",name:"Robek Kertas D (Cross-cut)",lane:"Lane_Prosesor",type:"task",doc:"Hash final dirobek setelah verifikasi, foto sebagai bukti.",pa
